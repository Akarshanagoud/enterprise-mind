apiVersion: apps/v1
kind: Deployment
metadata: {name: emind-api, labels: {app: emind}}
spec:
  replicas: 2
  selector: {matchLabels: {app: emind}}
  template:
    metadata:
      labels: {app: emind}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: emind:1.0.0
          ports: [{containerPort: 8000}]
          env:
            - name: EMIND_API_KEYS
              valueFrom: {secretKeyRef: {name: emind-secrets, key: api-keys}}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false}
---
apiVersion: v1
kind: Service
metadata: {name: emind-api}
spec:
  selector: {app: emind}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: emind-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: emind-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
